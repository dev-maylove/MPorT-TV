name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Ensure wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            # Generate wrapper without applying android plugin evaluation issues:
            # use system gradle only for wrapper jar
            gradle wrapper --gradle-version 9.6.1
            chmod +x ./gradlew
          fi

      - name: Compile Kotlin (debug)
        run: ./gradlew compileDebugKotlin --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon || true
