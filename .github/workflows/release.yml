name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Assemble release (unsigned / debug-key if no secrets)
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > keystore.jks
            ./gradlew assembleRelease --stacktrace --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
              -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD
          else
            echo "No signing secrets — building release unsigned / default"
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mport-tv-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
