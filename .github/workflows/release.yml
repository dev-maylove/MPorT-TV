name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.6.1
          fi
          chmod +x ./gradlew
          cat gradle/wrapper/gradle-wrapper.properties || true

      - name: Assemble release
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > keystore.jks
            ./gradlew assembleRelease --stacktrace --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
              -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD
          else
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mport-tv-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
